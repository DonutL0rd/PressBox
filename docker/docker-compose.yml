# ── PressBox — portable headless server ──────────────────────────
# Runs anywhere Docker runs (laptop, NAS, VPS, cloud VM).
# Playback happens in the client browser via /dashboard or /kiosk —
# no host display, audio, or HDMI required.
#
# Usage:
#   docker compose up -d
#   Open http://<server-ip>:5000/ in any browser.
# ─────────────────────────────────────────────────────────────────

services:
  pressbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pressbox

    ports:
      # Host 5050 → container 5000 (macOS AirPlay Receiver squats on :5000).
      # Change the host side freely; container side must stay 5000.
      - "5050:5000"

    volumes:
      - pressbox-data:/data

    env_file:
      - ../.env

    environment:
      - DATA_DIR=/data
      - TZ=America/Los_Angeles
      - ENABLE_LOCAL_BROWSER=false

    restart: unless-stopped

volumes:
  pressbox-data:
    driver: local
